name: Daily Swing Paper Trader (NSE)

on:
  schedule:
    # 4:00 PM IST Monday to Friday (10:30 AM UTC)
    - cron: '30 10 * * 1-5'
    # Diwali Muhurat Trading Session Post-Market (Nov 8, 2026: 3:45 PM IST = 10:15 AM UTC)
    - cron: '15 10 8 11 *'
    # Second post-close check (Nov 8, 2026: 4:00 PM IST = 10:30 AM UTC)
    - cron: '30 10 8 11 *'
  workflow_dispatch:
    inputs:
      force_execute:
        description: 'Force immediate trade execution'
        required: false
        default: false
        type: boolean

jobs:
  run-paper-trader:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_scanner/requirements.txt

      - name: Run Autonomous Paper Trader
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.SWING_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.GOD_SWING_ID }}
          FORCE_EXECUTE: ${{ github.event.inputs.force_execute || 'false' }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
        run: |
          python python_scanner/auto_paper_trader.py

      - name: Commit and push updated portfolio & logs
        run: |
          git config --global user.name "GodSwing-Bot"
          git config --global user.email "bot@godswing.local"
          git add python_scanner/signals/
          git commit -m "Auto-update paper trading portfolio [$(date +'%Y-%m-%d %H:%M IST')]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
