name: Autonomous Hybrid Stock Options Engine (Angel One)

on:
  schedule:
    # 09:30 AM IST Monday to Friday (04:00 AM UTC)
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
    inputs:
      force_execute:
        description: 'Force immediate single scan/check'
        required: false
        default: false
        type: boolean
      once_only:
        description: 'Run single check and exit (instead of full intraday daemon)'
        required: false
        default: false
        type: boolean

jobs:
  run-hybrid-options:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max for intraday session
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_scanner/requirements.txt

      - name: Run Hybrid Stock Options Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.SWING_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.GOD_SWING_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.once_only }}" = "true" ]; then
            FLAGS="$FLAGS --once"
          fi
          if [ "${{ github.event.inputs.force_execute }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          echo "Executing: python python_scanner/hybrid_stock_options_engine.py $FLAGS"
          python python_scanner/hybrid_stock_options_engine.py $FLAGS

      - name: Commit and push updated options portfolio & trade history
        if: always()
        run: |
          git config --global user.name "GodSwing-Bot"
          git config --global user.email "bot@godswing.local"
          git add python_scanner/signals/
          git commit -m "Auto-update hybrid stock options portfolio [$(date +'%Y-%m-%d %H:%M IST')]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
